[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant: Google mirror, project files and a live meeting copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "fastapi>=0.162.5",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "parakeet-mlx>=0.7.0",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
